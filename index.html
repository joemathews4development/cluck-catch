<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cluck & Catch</title>
    <link rel="stylesheet" href="./styles/style.css">
</head>
<body>
    <!-- START SCREEN -->
    <div id="start-screen" class="container">
      <img src="./images/logo.png" width="1000" alt="logo">
      <br>
      <input type="text" name="name" value="">
      <button id="start-btn">Start!</button>
    </div>
    
    <!-- GAME SCREEN -->
    <div id="game-screen" class="container">
      <!-- Game elements like score, lifes and other ui elements should be here (inside the game-screen but outside the game-box) -->

      <div id="game-box">
        <!-- Game elements will be added here via javascript and DOM manipulation -->
      </div>
      
    </div>
    
    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="container">
      <img src="./images/game_over.png" width="500" alt="logo">
    </div>
</body>
</html>
