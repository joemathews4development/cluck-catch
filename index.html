<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cluck & Catch</title>
    <link rel="stylesheet" href="./styles/style.css" />
  </head>
  <body>
    <!-- START SCREEN -->
    <div id="start-screen" class="container top-level-containers">
      <div id="start-screen-instructions" class="start-screen-side-content">
        <img src="./images/instructions.png" alt="instructions" id="instructions-image" />
      </div>
      <div id="start-center-screen" class="container">
        <img src="./images/logo.png" alt="logo" />
        <br>
        <p class="text-content">Choose your character</p>
        <div class="character-container">
          <div class="difficulty-option selected" id="easy">
            <img src="./images/easy_hen.png" alt="easy">
            <p class="text-content">easy</p>
          </div>
          <div class="difficulty-option" id="medium">
            <img src="./images/medium_hen.png" alt="easy">
            <p class="text-content">medium</p>
          </div>
          <div class="difficulty-option" id="hard">
            <img src="./images/hard_hen.png" alt="easy">
            <p class="text-content">hard</p>
          </div>
        </div>
        <br />
        <img
          src="./images/sound_on.png"
          id="start-screen-music"
          width="90"
          height="60"
          alt="logo"
        />

        <br />
        <input
          id="name"
          class="text-content"
          type="text"
          name="name"
          value=""
          placeholder="Enter your Name"
        />
        <button id="start-btn" class="gradient-background text-content">
          Lets Go!
        </button>
      </div>
      <div class="start-screen-side-content" id="high-scores-container">
        <ol id="high-scores" class="text-content">High Scores</ol>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="container">
      <!-- Game elements like score, lifes and other ui elements should be here (inside the game-screen but outside the game-box) -->
      <section id="game-screen-header">
        <div>
          <ul id="life-container"></ul>
        </div>
        <div id="game-screen-right-header">
          <img src="./images/sound_on.png" id="music" alt="logo" />
          <p id="score" class="text-content">score: 0</p>
        </div>
      </section>

      <div id="game-box">
        <!-- Game elements will be added here via javascript and DOM manipulation -->
      </div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="container top-level-containers">
      <img src="./images/game_over.png" alt="logo" />
      <p id="final-score" class="text-content">score: 0</p>
      <button id="restart" class="gradient-background text-content">
        Restart
      </button>
      <button id="start-new" class="gradient-background text-content">
        Start New
      </button>
    </div>

    <script src="./js/main.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/difficulty.js"></script>
    <script src="./js/chicken.js"></script>
    <script src="./js/eagle.js"></script>
    <script src="./js/fallingObject.js"></script>
    <script src="./js/localStorage.js"></script>
    <script src="./js/bullet.js"></script>
  </body>
</html>
